name: 🚀 Culture Pulse V8.0 - CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ===============================
  # TESTES E VALIDAÇÃO
  # ===============================
  test:
    name: 🧪 Tests & Quality
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 📦 Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src_v8/requirements.txt
        pip install pytest-cov black flake8 mypy

    - name: ⚙️ Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install frontend dependencies
      run: |
        cd culturepulse-web
        npm install

    - name: 🔧 Frontend lint + type check
      run: |
        cd culturepulse-web
        npm run lint
        npm run type-check

    - name:  Code formatting check
      run: |
        black --check src_v8/
        flake8 src_v8/ --max-line-length=100 --ignore=E203,W503

    - name: 🔍 Type checking
      run: |
        mypy src_v8/ --ignore-missing-imports

    - name: 🧪 Run tests
      run: |
        pytest src_v8/tests/ -v --cov=src_v8 --cov-report=xml
      env:
        REDIS_URL: redis://localhost:6379
        ENVIRONMENT: test
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    - name: 🦾 Validate V10 Logic (Regional & Persona)
      run: |
        python src_v8/regional_tribal_engine.py --dry-run
        python src_v8/simulate_action_impact.py --test-mode

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # ===============================
  # SEGURANÇA E VULNERABILIDADES
  # ===============================
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 🔒 Security audit
      run: |
        pip install safety bandit
        safety check -r src_v8/requirements.txt
        bandit -r src_v8/ -f json -o security-report.json || true

    - name: 📄 Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.json

  # ===============================
  # BUILD BACKEND
  # ===============================
  build-backend:
    name: 🐳 Backend Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔑 Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🏗️ Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          culturepulse/culture-pulse-v8-backend:latest
          culturepulse/culture-pulse-v8-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===============================
  # BUILD FRONTEND
  # ===============================
  build-frontend:
    name: 🌐 Frontend Build
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install frontend dependencies
      run: |
        cd culturepulse-web
        npm install

    - name: 🔍 Frontend lint
      run: |
        cd culturepulse-web
        npm run lint

    - name: 🔧 Frontend type check
      run: |
        cd culturepulse-web
        npm run type-check

    - name: 🏗️ Frontend build
      run: |
        cd culturepulse-web
        FASTAPI_URL=http://localhost:8000 NEXT_PUBLIC_SUPABASE_URL=http://localhost:3000 NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy npm run build

  # ===============================
  # DEPLOY CLOUDFLARE PAGES
  # ===============================
  deploy-cloudflare-pages:
    name: 🌍 Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 🚀 Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        directory: ./culturepulse-web

  deploy-cloudflare-pages-staging:
    name: 🌍 Deploy Cloudflare Pages Staging
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.ref == 'refs/heads/staging'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 🚀 Deploy to Cloudflare Pages Staging
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: ${{ secrets.CLOUDFLARE_STAGING_PROJECT_NAME }}
        directory: ./culturepulse-web

  # ===============================
  # DEPLOY RAILWAY
  # ===============================
  deploy-railway:
    name: 🚂 Deploy Railway
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🚂 Deploy to Railway
      uses: bervProject/railway-deploy@v1.0.0
      with:
        railway_token: ${{ secrets.RAILWAY_TOKEN }}
        service: "culture-pulse-v8"

  deploy-railway-staging:
    name: 🚂 Deploy Railway Staging
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.ref == 'refs/heads/staging'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🚂 Deploy to Railway Staging
      uses: bervProject/railway-deploy@v1.0.0
      with:
        railway_token: ${{ secrets.RAILWAY_TOKEN }}
        service: "culture-pulse-v8-staging"

  # ===============================
  # NOTIFICAÇÕES
  # ===============================
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy-railway, deploy-cloudflare-pages]
    if: always() && github.ref == 'refs/heads/main'

    steps:
    - name: 🎉 Success notification
      if: ${{ needs.deploy-cloudflare-pages.result == 'success' && needs.deploy-railway.result == 'success' }}
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "🚀 Culture Pulse V8.0 deployed successfully!"
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

    - name: ❌ Failure notification
      if: ${{ needs.deploy-cloudflare-pages.result != 'success' || needs.deploy-railway.result != 'success' }}
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "🚨 Culture Pulse V8.0 deployment failed!"
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ===============================
  # RELATÓRIO DE DEPLOY
  # ===============================
  deploy-report:
    name: 📊 Deploy Report
    runs-on: ubuntu-latest
    needs: [deploy-railway, deploy-cloudflare-pages]
    if: always() && github.ref == 'refs/heads/main'

    steps:
    - name: 📊 Generate deploy report
      run: |
        echo "# 🚀 Deploy Report - Culture Pulse V8.0" > deploy-report.md
        echo "" >> deploy-report.md
        echo "**Commit:** ${{ github.sha }}" >> deploy-report.md
        echo "**Branch:** ${{ github.ref_name }}" >> deploy-report.md
        echo "**Timestamp:** $(date -u)" >> deploy-report.md
        echo "" >> deploy-report.md
        echo "## 📋 Deploy Status" >> deploy-report.md
        echo "" >> deploy-report.md
        echo "- **Railway:** ${{ needs.deploy-railway.result }}" >> deploy-report.md
        echo "- **Cloudflare Pages:** ${{ needs.deploy-cloudflare-pages.result }}" >> deploy-report.md
        echo "" >> deploy-report.md
        echo "## 🔗 Links" >> deploy-report.md
        echo "" >> deploy-report.md
        echo "- **Frontend:** https://your-cloudflare-pages-domain.pages.dev" >> deploy-report.md
        echo "- **Backend API:** https://your-railway-backend-url.onrailway.app" >> deploy-report.md

    - name: 📄 Upload deploy report
      uses: actions/upload-artifact@v3
      with:
        name: deploy-report
        path: deploy-report.md
