# 🌐 NGINX CONFIGURATION FOR CULTURE PULSE V9.0
# Reverse proxy e load balancing para produção

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=5r/s;

    # Upstream para Culture Pulse V9.0
    upstream culture_pulse_backend {
        server culture-pulse-v9:8501;
        keepalive 32;
    }

    # Server block principal
    server {
        listen 80;
        server_name culture-pulse-v9.com www.culture-pulse-v9.com;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client max body size
        client_max_body_size 10M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket support for Streamlit
        location / {
            proxy_pass http://culture_pulse_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Rate limiting
            limit_req zone=dashboard burst=20 nodelay;
        }

        # Health check endpoint
        location /_stcore/health {
            proxy_pass http://culture_pulse_backend;
            access_log off;
        }

        # Static files cache
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://culture_pulse_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API endpoints with stricter rate limiting
        location /api/ {
            proxy_pass http://culture_pulse_backend;
            limit_req zone=api burst=10 nodelay;
        }

        # Block common attack patterns
        location ~ /\. {
            deny all;
        }

        location ~ /(wp-admin|wp-login|xmlrpc) {
            deny all;
        }
    }

    # HTTPS server block (quando SSL estiver configurado)
    server {
        listen 443 ssl http2;
        server_name culture-pulse-v9.com www.culture-pulse-v9.com;

        # SSL configuration
        ssl_certificate /etc/ssl/culture-pulse.crt;
        ssl_certificate_key /etc/ssl/culture-pulse.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Include same location blocks as HTTP server
        include /etc/nginx/conf.d/culture-pulse-locations.conf;
    }
}
